name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            if [ "$GITHUB_REF" = "refs/heads/main" ]; then
              echo "::error::KEYSTORE_B64 / KEYSTORE_PASSWORD secrets are missing; refusing to publish a build with the wrong key."
              exit 1
            fi
            echo "No signing secrets: debug-signed check build."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ljos-release.p12"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/ljos-release.p12" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Test and build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk ljos.apk

      - name: Live feed check
        continue-on-error: true
        env:
          LIVE_CHECK: "1"
        run: ./gradlew --no-daemon testReleaseUnitTest --tests app.ljos.LiveCheck --rerun

      - name: Release notes
        run: |
          {
            echo "Tap **ljos.apk** below on your phone to install or update."
            echo
            echo "Built from ${GITHUB_SHA}."
            echo
            cat app/build/live-check.md 2>/dev/null || echo "_Live feed check didn't complete._"
          } > notes.md

      - name: Publish release
        # Only main publishes; other branches are build checks.
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Ljós 1.0.${{ github.run_number }}
          body_path: notes.md
          files: ljos.apk
          make_latest: true
