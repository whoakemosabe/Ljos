name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk ljos.apk

      - name: Live feed check
        continue-on-error: true
        env:
          LIVE_CHECK: "1"
        run: ./gradlew --no-daemon testReleaseUnitTest --tests app.ljos.LiveCheck --rerun

      - name: Release notes
        run: |
          {
            echo "Tap **ljos.apk** below on your phone to install or update."
            echo
            echo "Built from ${GITHUB_SHA}."
            echo
            cat app/build/live-check.md 2>/dev/null || echo "_Live feed check didn't complete._"
          } > notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Ljós 1.0.${{ github.run_number }}
          body_path: notes.md
          files: ljos.apk
          make_latest: true
