name: Data feed probe

on:
  workflow_dispatch:
  push:
    branches: [data-probe]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dig deeper
        shell: bash
        run: |
          exec > >(tee probe-results.txt) 2>&1
          UA="Mozilla/5.0 (Linux; Android 15) AppleWebKit/537.36 Chrome/141 Mobile Safari/537.36"
          ctx() { grep -oE ".{0,200}$1.{0,300}" "$2" | head -${3:-15}; }
          W=$(mktemp -d)

          set +e
          B=https://datalogger.hafogvatn.cloud/ext/measurements
          curl -sS -A "$UA" -H 'Accept: application/json' "$B/locations/info" -o $W/info.json -w 'info -> %{http_code} %{content_type} %{size_download}\n'
          echo "===== locations/info (first 3000 chars)"; head -c 3000 $W/info.json; echo
          echo "===== all location names + coords"
          python3 - "$W/info.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          items=d if isinstance(d,list) else d.get('content') or d.get('locations') or list(d.values())
          print(type(d).__name__, len(items))
          for x in items:
              print({k:v for k,v in x.items() if not isinstance(v,(list,dict))} if isinstance(x,dict) else x)
          PY
          for name in Keflavík Grindavík Sandgerði Reykjavík Hafnarfjörður; do
            for vt in TEMPERATURE temperature Temperature; do
              u="$B/locations/names/newest?locationName=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" $name)&valueType=$vt"
              code=$(curl -sS -o $W/o -w '%{http_code}' -A "$UA" "$u"); echo "== newest $name $vt -> $code"; head -c 400 $W/o; echo
            done
          done
          exit 0
      - name: Save results to the branch
        if: always()
        run: |
          git config user.name "probe"
          git config user.email "probe@users.noreply.github.com"
          git add probe-results.txt
          git commit -m "Probe results [skip ci]" || true
          git push
