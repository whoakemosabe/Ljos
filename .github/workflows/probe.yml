name: Data feed probe

on:
  workflow_dispatch:
  push:
    branches: [data-probe]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dig deeper
        shell: bash
        run: |
          exec > >(tee probe-results.txt) 2>&1
          UA="Mozilla/5.0 (Linux; Android 15) AppleWebKit/537.36 Chrome/141 Mobile Safari/537.36"
          ctx() { grep -oE ".{0,200}$1.{0,300}" "$2" | head -${3:-15}; }
          W=$(mktemp -d)

          set +e
          curl -sSL -A "$UA" https://sjavarhiti.hafogvatn.cloud/main-34HM7BUJ.js -o $W/sh.js
          for c in $(grep -oE 'chunk-[A-Z0-9]+\.js' $W/sh.js | sort -u); do curl -sSL -A "$UA" "https://sjavarhiti.hafogvatn.cloud/$c" >> $W/sh.js; echo >> $W/sh.js; done
          echo "===== code around the datalogger URL"
          grep -oE '.{0,700}datalogger\.hafogvatn\.cloud/ext/measurements.{0,900}' $W/sh.js | head -2
          echo
          echo "===== other code using the measurements service"
          grep -oE '.{0,300}(measurements|stations|locations)[`"/?].{0,300}' $W/sh.js | grep -v highcharts | head -12
          echo
          B=https://datalogger.hafogvatn.cloud/ext
          for p in measurements "measurements?limit=5" locations stations sensors "" ; do
            code=$(curl -sS -o $W/o -w '%{http_code} %{content_type} %{size_download}' -A "$UA" -H 'Accept: application/json' "$B/$p")
            echo "== $B/$p -> $code"; head -c 1200 $W/o; echo; echo
          done
          exit 0
      - name: Save results to the branch
        if: always()
        run: |
          git config user.name "probe"
          git config user.email "probe@users.noreply.github.com"
          git add probe-results.txt
          git commit -m "Probe results [skip ci]" || true
          git push
