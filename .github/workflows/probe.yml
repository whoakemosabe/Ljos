name: Data feed probe

on:
  workflow_dispatch:
  push:
    branches: [data-probe]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dig deeper
        shell: bash
        run: |
          exec > >(tee probe-results.txt) 2>&1
          UA="Mozilla/5.0 (Linux; Android 15) AppleWebKit/537.36 Chrome/141 Mobile Safari/537.36"
          ctx() { grep -oE ".{0,200}$1.{0,300}" "$2" | head -${3:-15}; }
          W=$(mktemp -d)

          echo "===== SJAVARHITI main bundle: context around sjora / http / fetch"
          curl -sSL -A "$UA" https://sjavarhiti.hafogvatn.cloud/main-34HM7BUJ.js -o $W/sh.js
          ctx 'sjora\.hafro\.is' $W/sh.js 20
          echo "--- quoted paths in bundle"
          grep -oE '"/[a-zA-Z0-9_/-]{2,60}"' $W/sh.js | sort -u | head -80
          echo "--- template/concat urls"
          grep -oE '`[^`]{0,40}(api|\$\{)[^`]{0,120}`' $W/sh.js | sort -u | head -40

          echo "===== SJORA.HAFRO.IS"
          for p in "" api api/ api/stations stations api/v1 swagger openapi.json docs; do
            code=$(curl -sS -o $W/sj.out -w '%{http_code} %{content_type}' -A "$UA" "https://sjora.hafro.is/$p")
            echo "/$p -> $code"; head -c 600 $W/sj.out; echo; echo
          done

          echo "===== SJOLAG bundles: context around gagnaveita and /api"
          curl -sSL -A "$UA" https://sjolag.is/dufl -o $W/dufl.html
          for s in $(grep -oE '/_next/static/chunks/[^"]+\.js' $W/dufl.html | sort -u); do curl -sSL -A "$UA" "https://sjolag.is$s" >> $W/sl.js; echo >> $W/sl.js; done
          ctx 'gagnaveita\.vegagerdin\.is' $W/sl.js 20
          echo "--- /api context"
          ctx '"/api/' $W/sl.js 20
          echo "--- server-rendered page: look for embedded data"
          grep -oE '.{0,100}(dufl|buoy|Buoy|ölduh|wave|Hs|station|Station|stod)[^<]{0,200}' $W/dufl.html | head -30
          echo "--- size of page"; wc -c $W/dufl.html

          echo "===== GAGNAVEITA probes"
          for p in "" api api/ api/sjolag sjolag api/dufl dufl swagger swagger/index.html openapi.json vs; do
            code=$(curl -sS -o $W/g.out -w '%{http_code} %{content_type}' -A "$UA" "https://gagnaveita.vegagerdin.is/$p")
            echo "/$p -> $code"; head -c 400 $W/g.out; echo; echo
          done
      - name: Save results to the branch
        if: always()
        run: |
          git config user.name "probe"
          git config user.email "probe@users.noreply.github.com"
          git add probe-results.txt
          git commit -m "Probe results [skip ci]" || true
          git push
