name: Data feed probe

on:
  workflow_dispatch:
  push:
    branches: [data-probe]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dig deeper
        shell: bash
        run: |
          exec > >(tee probe-results.txt) 2>&1
          UA="Mozilla/5.0 (Linux; Android 15) AppleWebKit/537.36 Chrome/141 Mobile Safari/537.36"
          ctx() { grep -oE ".{0,200}$1.{0,300}" "$2" | head -${3:-15}; }
          W=$(mktemp -d)

          set +e
          echo "===== SJAVARHITI: how the app fetches data"
          curl -sSL -A "$UA" https://sjavarhiti.hafogvatn.cloud/main-34HM7BUJ.js -o $W/sh.js
          wc -c $W/sh.js
          echo "--- .get/.post calls"
          grep -oE '\.(get|post|request)\([^)]{0,160}' $W/sh.js | grep -vE '^\.get\((t|e|n|i|a|r|s|o|this)\)$' | sort -u | head -60
          echo "--- strings with api / json / csv / data / gogn"
          grep -oE '"[^"]{0,80}(api|\.json|\.csv|gogn|data/|Url|URL|url)[^"]{0,80}"' $W/sh.js | sort -u | head -60
          echo "--- environment / base url"
          grep -oE '.{0,120}(apiUrl|baseUrl|apiBase|environment|BASE_URL|endpoint).{0,200}' $W/sh.js | head -15
          echo "--- try likely same-origin data paths"
          for p in api api/stations api/stodvar api/stations/ assets/stations.json assets/data.json stodvar stations.json data.json; do
            code=$(curl -sS -o $W/o -w '%{http_code} %{content_type}' -A "$UA" "https://sjavarhiti.hafogvatn.cloud/$p")
            echo "/$p -> $code"; head -c 300 $W/o | tr '\n' ' '; echo
          done

          echo "===== SJOLAG bundles"
          curl -sSL -A "$UA" https://sjolag.is/dufl -o $W/dufl.html
          for s in $(grep -oE '/_next/static/chunks/[^"]+\.js' $W/dufl.html | sort -u); do curl -sSL -A "$UA" "https://sjolag.is$s" >> $W/sl.js; echo >> $W/sl.js; done
          wc -c $W/sl.js $W/dufl.html
          echo "--- gagnaveita context"
          grep -oE '.{0,250}gagnaveita\.vegagerdin\.is.{0,300}' $W/sl.js | head -10
          echo "--- /api context"
          grep -oE '.{0,150}"/api/.{0,250}' $W/sl.js | head -15
          echo "--- embedded data in the server-rendered buoy page"
          grep -oE '.{0,80}(ufl|uoy|Hs|wave|ave_|station|tod)[^<]{0,160}' $W/dufl.html | head -25
          echo "--- try sjolag api paths"
          for p in api api/dufl api/buoys api/stations api/harbours api/hafnir api/monitor; do
            code=$(curl -sS -o $W/o -w '%{http_code} %{content_type}' -A "$UA" "https://sjolag.is/$p")
            echo "/$p -> $code"; head -c 300 $W/o | tr '\n' ' '; echo
          done

          echo "===== GAGNAVEITA"
          for p in "" api swagger swagger/index.html openapi.json vs sjolag; do
            code=$(curl -sS -o $W/o -w '%{http_code} %{content_type}' -A "$UA" "https://gagnaveita.vegagerdin.is/$p")
            echo "/$p -> $code"; head -c 300 $W/o | tr '\n' ' '; echo
          done
          exit 0
      - name: Save results to the branch
        if: always()
        run: |
          git config user.name "probe"
          git config user.email "probe@users.noreply.github.com"
          git add probe-results.txt
          git commit -m "Probe results [skip ci]" || true
          git push
